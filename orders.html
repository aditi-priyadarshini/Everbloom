<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Everbloom</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">🌸 Everbloom</a>
  <ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li><li><a href="orders.html">My Orders</a></li></ul>
  <div class="nav-actions">
    <div style="position:relative"><button class="nav-icon-btn" id="notif-btn" onclick="toggleNotifDropdown()">🔔<span class="badge" id="notif-badge" style="display:none">0</span></button><div class="notif-dropdown" id="notif-dropdown"><div class="notif-header"><span style="font-size:14px;font-weight:500">Notifications</span><button onclick="markAllRead()" style="font-size:12px;color:var(--brown-accent);cursor:pointer;background:none;border:none">Mark all read</button></div><div id="notif-list"></div></div></div>
    <a href="cart.html" class="nav-icon-btn">🛒<span class="badge" id="cart-badge" style="display:none">0</span></a>
    <div id="user-menu" style="display:none;align-items:center;gap:12px"><span style="font-size:13px;color:var(--text-secondary)">Hi, <span class="user-name"></span></span><button onclick="signOut()" class="btn btn-secondary btn-sm">Logout</button></div>
  </div>
</nav>

<div class="page-header"><h1>My Orders</h1><p>Your Everbloom journey</p></div>

<div class="container" style="padding-top:48px;padding-bottom:80px;max-width:900px">
  <div id="orders-list">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
const STATUS_CONFIG = {
  placed: { label: 'Order Placed', icon: '🛒', color: '#8B6E3C' },
  payment_confirmed: { label: 'Payment Confirmed', icon: '✅', color: '#4A7A4D' },
  accepted: { label: 'Accepted by Artist', icon: '🎨', color: '#3B6DB8' },
  material_sourced: { label: 'Materials Sourced', icon: '🪵', color: '#5A7A53' },
  crafting: { label: 'Crafting', icon: '✂️', color: '#8B6A20' },
  quality_check: { label: 'Quality Check', icon: '🔍', color: '#8B5E3C' },
  packed: { label: 'Packed', icon: '📦', color: '#6A4A8A' },
  shipped: { label: 'Shipped', icon: '🚚', color: '#2A7A9A' },
  delivered: { label: 'Delivered', icon: '🌸', color: '#388E3C' },
  cancelled: { label: 'Cancelled', icon: '❌', color: '#C0614A' },
};

async function loadOrders() {
  const user = await requireAuth('/login.html?redirect=/orders.html');
  if (!user) return;

  const { data: orders } = await supabase
    .from('orders')
    .select('*, order_items(quantity, unit_price, product_snapshot, products(title, images))')
    .eq('customer_id', user.id)
    .order('created_at', { ascending: false });

  const container = document.getElementById('orders-list');

  if (!orders || orders.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🛒</div>
        <h3>No orders yet</h3>
        <p>Start shopping and your orders will appear here</p>
        <a href="shop.html" class="btn btn-primary btn-lg">Browse Shop</a>
      </div>
    `;
    return;
  }

  container.innerHTML = orders.map(order => {
    const status = STATUS_CONFIG[order.status] || { label: order.status, icon: '📋', color: '#666' };
    const totalItems = order.order_items?.reduce((sum, i) => sum + i.quantity, 0) || 0;
    const previewImages = order.order_items?.slice(0, 3).map(i => i.products?.images?.[0] || null) || [];

    return `
      <div class="card" style="margin-bottom:16px;cursor:pointer" onclick="location.href='track.html?id=${order.id}'">
        <div style="padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
          <div style="display:flex;gap:16px;align-items:center">
            <!-- Item previews -->
            <div style="display:flex;gap:-8px">
              ${previewImages.map((img, i) => `
                <div style="width:52px;height:52px;border-radius:var(--radius);overflow:hidden;background:var(--sand);border:2px solid white;margin-left:${i > 0 ? '-16px' : '0'};box-shadow:var(--shadow-sm)">
                  ${img ? `<img src="${img}" style="width:100%;height:100%;object-fit:cover">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px">🎨</div>`}
                </div>
              `).join('')}
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="font-size:14px;font-weight:600;color:var(--text-primary)">#${order.id.substring(0,8).toUpperCase()}</span>
                <span class="status-badge status-${order.status}">${status.icon} ${status.label}</span>
              </div>
              <p style="font-size:12px;color:var(--text-muted)">${formatDate(order.created_at)} · ${totalItems} item${totalItems !== 1 ? 's' : ''}</p>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:20px">
            <div style="text-align:right">
              <p style="font-size:11px;color:var(--text-muted);margin-bottom:2px">Total</p>
              <p style="font-family:var(--font-display);font-size:20px;color:var(--brown-dark)">${formatPrice(order.total_amount)}</p>
            </div>
            <div style="color:var(--text-muted);font-size:20px">›</div>
          </div>
        </div>

        <!-- Progress bar -->
        ${order.status !== 'cancelled' ? (() => {
          const steps = ['placed','payment_confirmed','accepted','material_sourced','crafting','quality_check','packed','shipped','delivered'];
          const idx = steps.indexOf(order.status);
          const pct = idx >= 0 ? ((idx / (steps.length-1)) * 100) : 0;
          return `
            <div style="padding:0 24px 16px">
              <div style="height:3px;background:var(--sand);border-radius:2px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:var(--brown-accent);border-radius:2px;transition:width 0.5s ease"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:6px">
                <span style="font-size:10px;color:var(--text-muted)">Order Placed</span>
                <span style="font-size:10px;color:var(--text-muted)">Delivered</span>
              </div>
            </div>
          `;
        })() : ''}
      </div>
    `;
  }).join('');
}

loadOrders();
</script>
</body>
</html>
