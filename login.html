<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Everbloom</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--cream); }
    .auth-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; width: 100%; }
    .auth-art {
      background: var(--brown-dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px; position: relative; overflow: hidden;
    }
    .auth-art::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C4A882' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .auth-card { padding: 60px; display: flex; align-items: center; justify-content: center; }
    .auth-form { width: 100%; max-width: 420px; }
    @media (max-width: 768px) {
      .auth-split { grid-template-columns: 1fr; }
      .auth-art { display: none; }
      .auth-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>
<div class="auth-split">
  <!-- Art Side -->
  <div class="auth-art">
    <div style="position:relative;z-index:2;text-align:center">
      <div style="font-size:80px;margin-bottom:24px">🌸</div>
      <h1 style="font-family:var(--font-display);font-size:48px;color:var(--cream);font-weight:300;line-height:1.1;margin-bottom:16px">
        Welcome<br><em>back</em>
      </h1>
      <p style="color:var(--brown-light);font-size:15px;line-height:1.7;max-width:280px;margin:0 auto">
        Sign in to track your orders, manage your cart, and discover new handcrafted pieces.
      </p>
      <div style="margin-top:48px;padding-top:48px;border-top:1px solid rgba(196,168,130,0.15)">
        <p style="color:rgba(196,168,130,0.5);font-size:12px;letter-spacing:2px;text-transform:uppercase">Every piece. Handcrafted.</p>
      </div>
    </div>
  </div>

  <!-- Form Side -->
  <div class="auth-card">
    <div class="auth-form">
      <a href="index.html" style="font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;margin-bottom:40px">← Back to store</a>
      <h2 style="font-family:var(--font-display);font-size:36px;margin-bottom:8px">Sign In</h2>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:36px">Don't have an account? <a href="signup.html" style="color:var(--brown-accent);font-weight:500">Sign up</a></p>

      <div id="error-msg" style="display:none;background:rgba(192,97,74,0.1);border:1px solid rgba(192,97,74,0.3);color:var(--error);padding:12px 16px;border-radius:var(--radius);font-size:14px;margin-bottom:20px"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between">
          Password
          <a href="#" style="color:var(--brown-accent);text-transform:none;font-size:12px;letter-spacing:0">Forgot password?</a>
        </label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button id="login-btn" class="btn btn-primary btn-full btn-lg" onclick="handleLogin()">
        Sign In
      </button>

      <div style="margin-top:24px;text-align:center">
        <p style="font-size:12px;color:var(--text-muted)">By signing in, you agree to our <a href="#" style="color:var(--brown-accent)">Terms of Service</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/supabase.js"></script>
<script>
// Redirect if already logged in
getCurrentUser().then(user => {
  if (user) window.location.href = '/index.html';
});

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');

  if (!email || !password) {
    showError('Please fill in all fields.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    showError(error.message || 'Invalid email or password.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
    return;
  }

  // Check if admin — redirect accordingly
  const profile = await getCurrentProfile();
  if (profile?.role === 'admin') {
    window.location.href = '/admin/index.html';
  } else {
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/index.html';
    window.location.href = redirect;
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
