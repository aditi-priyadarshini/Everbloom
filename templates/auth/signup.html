{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <a class="auth-logo" href="{{ url_for('shop.index') }}">Ever<span>bloom</span></a>
    <h1>Create account</h1>
    <p class="auth-sub">Join and start shopping handcrafted pieces</p>
    {% if error %}<div class="form-error-box">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required autofocus>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary btn-full">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
