{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <a class="auth-logo" href="{{ url_for('shop.index') }}">Ever<span>bloom</span></a>
    <h1>Reset password</h1>
    <p class="auth-sub">Enter your new password below.</p>
    {% if error %}<div class="form-error-box">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required autofocus>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary btn-full">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
