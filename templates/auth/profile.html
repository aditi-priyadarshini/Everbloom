{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="page-wrap narrow">
  <h1 class="page-title">My Profile</h1>
  {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}
  <form method="post" class="profile-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" value="{{ user.name or '' }}" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" value="{{ user.email }}" disabled class="input-disabled">
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="tel" name="phone" value="{{ user.phone or '' }}">
    </div>
    <div class="form-group">
      <label>Default Address</label>
      <textarea name="address" rows="3">{{ user.address or '' }}</textarea>
    </div>
    <button type="submit" class="btn-primary">Save Changes</button>
  </form>
  <div class="profile-links">
    <a href="{{ url_for('orders.orders_list') }}">View My Orders →</a>
  </div>
</div>
{% endblock %}
