{% extends "base.html" %}
{% block title %}Profile — {{ store_name }}{% endblock %}
{% block content %}
<div class="page-header"><h1>My Profile</h1></div>
<div class="container" style="max-width:540px;padding-top:48px;padding-bottom:80px">
  <div style="background:white;border:1.5px solid var(--border);border-radius:var(--rl);padding:32px">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-input" value="{{ current_user.full_name }}" required></div>
      <div class="form-group"><label class="form-label">Email (cannot be changed)</label>
        <input type="email" class="form-input" value="{{ current_user.email }}" disabled style="opacity:.6"></div>
      <div class="form-group"><label class="form-label">Phone</label>
        <input type="tel" name="phone" class="form-input" value="{{ current_user.phone or '' }}"></div>
      <div class="form-group"><label class="form-label">Default Address</label>
        <textarea name="address" class="form-textarea" rows="3">{{ current_user.address or '' }}</textarea></div>
      <button type="submit" class="btn btn-clay">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
