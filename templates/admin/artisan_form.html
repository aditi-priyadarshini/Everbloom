{% extends 'admin/base_admin.html' %}{% block title %}Artisan editor{% endblock %}{% block page_title %}Artisan editor{% endblock %}{% block content %}<section class="admin-card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for key in ['name','location','speciality','instagram'] %}<div class="form-group"><label>{{ key|title }}</label><input name="{{ key }}" value="{{ artisan.get(key,'') if artisan else '' }}" {% if key=='name' %}required{% endif %}></div>{% endfor %}<div class="form-group"><label>Story</label><textarea name="bio" rows="5">{{ artisan.bio or '' if artisan else '' }}</textarea></div><div class="form-group"><label>Portrait</label><input type="file" name="image" accept="image/jpeg,image/png,image/webp"></div><label><input type="checkbox" name="active" {% if not artisan or artisan.active %}checked{% endif %}> Active</label><button class="btn-primary">Save artisan</button></form></section>{% endblock %}
