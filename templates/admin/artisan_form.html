{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if artisan else 'New' }} Artisan{% endblock %}
{% block page_title %}{{ 'Edit Artisan' if artisan else 'Add Artisan' }}{% endblock %}
{% block content %}
<div class="form-page-wrap narrow">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="admin-card">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" value="{{ artisan.name if artisan else '' }}" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Speciality</label>
          <input type="text" name="speciality" value="{{ artisan.speciality if artisan else '' }}" placeholder="e.g. Pottery, Paintings">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" name="location" value="{{ artisan.location if artisan else '' }}" placeholder="e.g. Jaipur, Rajasthan">
        </div>
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea name="bio" rows="4">{{ artisan.bio if artisan else '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Instagram Handle (without @)</label>
        <input type="text" name="instagram" value="{{ artisan.instagram if artisan else '' }}" placeholder="handmade_by_priya">
      </div>
      <div class="form-group">
        <label>Photo</label>
        {% if artisan and artisan.image_url %}
        <img src="{{ artisan.image_url }}" style="width:80px;height:80px;object-fit:cover;border-radius:50%;margin-bottom:.8rem;border:2px solid #e8c4b8;">
        {% endif %}
        <input type="file" name="image" accept="image/*" class="file-input">
      </div>
      <label class="toggle-label">
        <input type="checkbox" name="active" {% if not artisan or artisan.active %}checked{% endif %}>
        <span class="toggle-track-ui"></span>
        Show on website
      </label>
    </div>
    <div style="display:flex;gap:.8rem;">
      <button type="submit" class="btn-primary">{{ 'Save Changes' if artisan else 'Add Artisan' }}</button>
      <a href="{{ url_for('admin.artisans') }}" class="btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
