{% extends "admin/base_admin.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<div class="form-page-wrap narrow">
  <form method="post" enctype="multipart/form-data" class="settings-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="admin-card">
      <h3>UPI Payment Settings</h3>
      <div class="form-group">
        <label>UPI ID</label>
        <input type="text" name="upi_id" value="{{ upi_id or '' }}" placeholder="yourname@upi">
      </div>
      <div class="form-group">
        <label>UPI QR Code Image</label>
        {% if upi_qr_url %}
        <div style="margin-bottom:1rem;">
          <img src="{{ upi_qr_url }}" alt="UPI QR" style="width:160px;border-radius:8px;border:1px solid var(--rose);">
          <p class="muted" style="font-size:.8rem;margin-top:.4rem;">Current QR code</p>
        </div>
        {% endif %}
        <input type="file" name="upi_qr" accept="image/*" class="file-input">
        <p class="form-hint">Upload a new QR to replace the current one.</p>
      </div>
      <button type="submit" class="btn-primary">Save Settings</button>
    </div>
  </form>
</div>
{% endblock %}
