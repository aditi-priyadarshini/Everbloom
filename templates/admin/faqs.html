{% extends "admin/base_admin.html" %}
{% block title %}FAQs{% endblock %}
{% block page_title %}FAQs{% endblock %}
{% block content %}
<div class="admin-card" style="margin-bottom:1.5rem;">
  <h3>Add New FAQ</h3>
  <form method="post" action="{{ url_for('admin.faq_new') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <select name="category">
          <option>general</option><option>ordering</option><option>payments</option>
          <option>shipping</option><option>returns</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sort Order</label>
        <input type="number" name="sort_order" value="{{ faqs|length + 1 }}">
      </div>
    </div>
    <div class="form-group">
      <label>Question *</label>
      <input type="text" name="question" required>
    </div>
    <div class="form-group">
      <label>Answer *</label>
      <textarea name="answer" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn-primary">Add FAQ</button>
  </form>
</div>
<div class="admin-table-wrap">
  <table class="admin-table">
    <thead><tr><th>#</th><th>Question</th><th>Category</th><th></th></tr></thead>
    <tbody>
      {% for f in faqs %}
      <tr>
        <td>{{ f.sort_order }}</td>
        <td>{{ f.question }}</td>
        <td><span class="status-pill status-placed">{{ f.category }}</span></td>
        <td>
          <form method="post" action="{{ url_for('admin.faq_delete', fid=f.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="table-action danger" onclick="return confirm('Delete?')">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="empty-row">No FAQs yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
