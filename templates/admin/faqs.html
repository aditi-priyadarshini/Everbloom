{% extends 'admin/base_admin.html' %}{% block title %}FAQs{% endblock %}{% block page_title %}FAQs{% endblock %}{% block content %}<section class="admin-card"><form method="post" action="{{ url_for('admin.faq_new') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label>Question</label><input name="question" required></div><div class="form-group"><label>Answer</label><textarea name="answer" rows="4" required></textarea></div><button class="btn-primary">Add FAQ</button></form></section>{% for f in faqs %}<article class="admin-card"><h3>{{ f.question }}</h3><p>{{ f.answer }}</p><form method="post" action="{{ url_for('admin.faq_delete',fid=f.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn-outline-sm">Remove FAQ</button></form></article>{% else %}<p>No FAQs yet.</p>{% endfor %}{% endblock %}
