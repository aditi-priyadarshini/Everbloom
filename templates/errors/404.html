{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px">
  <div style="font-size:72px;margin-bottom:20px">🌿</div>
  <h1 style="font-family:var(--serif);font-size:48px;color:var(--ink);margin-bottom:12px">Page Not Found</h1>
  <p style="color:var(--muted);font-size:16px;margin-bottom:32px;max-width:380px">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('shop.home') }}" class="btn btn-clay btn-lg">Back to Home</a>
</div>
{% endblock %}
