<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Everbloom</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; padding: 60px 0; align-items: start; }
    .product-images { position: sticky; top: 90px; }
    .main-image { aspect-ratio: 1; background: var(--sand); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px; }
    .main-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .main-image:hover img { transform: scale(1.04); }
    .thumb-row { display: flex; gap: 8px; }
    .thumb { width: 72px; height: 72px; border-radius: var(--radius); overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color var(--transition); background: var(--sand); }
    .thumb.active { border-color: var(--brown-accent); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .qty-control { display: flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; width: fit-content; }
    .qty-btn { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-secondary); transition: background var(--transition); }
    .qty-btn:hover { background: var(--sand); }
    .qty-val { width: 48px; height: 44px; text-align: center; font-size: 15px; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: white; color: var(--text-primary); }
    @media (max-width: 768px) { .product-layout { grid-template-columns: 1fr; gap: 40px; } .product-images { position: static; } }
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">🌸 Everbloom</a>
  <ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li><li><a href="orders.html">My Orders</a></li></ul>
  <div class="nav-actions">
    <div style="position:relative"><button class="nav-icon-btn" id="notif-btn" onclick="toggleNotifDropdown()">🔔<span class="badge" id="notif-badge" style="display:none">0</span></button><div class="notif-dropdown" id="notif-dropdown"><div class="notif-header"><span style="font-size:14px;font-weight:500">Notifications</span><button onclick="markAllRead()" style="font-size:12px;color:var(--brown-accent);cursor:pointer;background:none;border:none">Mark all read</button></div><div id="notif-list"></div></div></div>
    <a href="cart.html" class="nav-icon-btn">🛒<span class="badge" id="cart-badge" style="display:none">0</span></a>
    <div id="auth-links" style="display:flex;gap:10px"><a href="login.html" class="btn btn-secondary btn-sm">Login</a><a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a></div>
    <div id="user-menu" style="display:none;align-items:center;gap:12px"><a href="orders.html" style="font-size:13px;color:var(--text-secondary)">Hi, <span class="user-name"></span></a><a href="admin/index.html" class="admin-link btn btn-sm" style="display:none;background:var(--brown-accent);color:white;padding:6px 14px;border-radius:4px;font-size:11px;letter-spacing:1px">Admin</a><button onclick="signOut()" class="btn btn-secondary btn-sm">Logout</button></div>
  </div>
</nav>

<!-- Breadcrumb -->
<div style="background:var(--warm-white);border-bottom:1px solid var(--border);padding:12px 40px">
  <div class="container" style="padding:0">
    <nav style="font-size:13px;color:var(--text-muted)">
      <a href="index.html" style="color:var(--text-muted)">Home</a>
      <span style="margin:0 8px">›</span>
      <a href="shop.html" style="color:var(--text-muted)">Shop</a>
      <span style="margin:0 8px">›</span>
      <span id="breadcrumb-title" style="color:var(--text-primary)">...</span>
    </nav>
  </div>
</div>

<div class="container">
  <div id="product-content">
    <div class="loader" style="padding:120px 0"><div class="spinner"></div></div>
  </div>
</div>

<!-- Related products -->
<section class="section" style="background:var(--warm-white)">
  <div class="container">
    <div class="section-header">
      <p class="section-tag">You may also like</p>
      <h2 class="section-title">Related Pieces</h2>
    </div>
    <div class="grid-4" id="related-products">
      <div class="loader" style="grid-column:1/-1"><div class="spinner"></div></div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:1px solid rgba(196,168,130,0.15);padding-top:32px">
      <span>© 2024 Everbloom.</span><a href="index.html" style="color:var(--brown-light)">🌸 Home</a>
    </div>
  </div>
</footer>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
let currentProduct = null;
let currentImageIndex = 0;

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) { window.location.href = 'shop.html'; return; }

  const { data: p } = await supabase
    .from('products')
    .select('*, categories(name, slug, icon)')
    .eq('id', id)
    .single();

  if (!p) { window.location.href = 'shop.html'; return; }

  currentProduct = p;
  document.title = `${p.title} — Everbloom`;
  document.getElementById('breadcrumb-title').textContent = p.title;

  const images = p.images?.length > 0 ? p.images : [];
  const hasImages = images.length > 0;

  document.getElementById('product-content').innerHTML = `
    <div class="product-layout">
      <!-- Images -->
      <div class="product-images">
        <div class="main-image" id="main-img">
          ${hasImages
            ? `<img src="${images[0]}" alt="${p.title}" id="main-img-el">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;color:var(--brown-light);aspect-ratio:1">${p.categories?.icon || '🎨'}</div>`
          }
        </div>
        ${hasImages && images.length > 1 ? `
          <div class="thumb-row">
            ${images.map((img, i) => `
              <div class="thumb ${i === 0 ? 'active' : ''}" onclick="setImage(${i})" id="thumb-${i}">
                <img src="${img}" alt="${p.title} ${i+1}">
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>

      <!-- Details -->
      <div style="padding-top:8px">
        <div style="font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--brown-accent);margin-bottom:12px">
          ${p.categories?.icon || ''} ${p.categories?.name || 'Art'}
        </div>
        <h1 style="font-family:var(--font-display);font-size:48px;font-weight:400;line-height:1.1;margin-bottom:20px">${p.title}</h1>

        <!-- Price -->
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:28px">
          <span style="font-size:36px;font-weight:600;color:var(--brown-dark)">${formatPrice(p.final_price)}</span>
          ${p.discount_percent > 0 ? `
            <span style="font-size:20px;color:var(--text-muted);text-decoration:line-through">${formatPrice(p.price)}</span>
            <span style="background:var(--sage);color:white;padding:4px 10px;border-radius:4px;font-size:13px;font-weight:600">${p.discount_percent}% off</span>
          ` : ''}
        </div>

        <!-- Description -->
        <p style="font-size:15px;color:var(--text-secondary);line-height:1.8;margin-bottom:32px">${p.description || 'A beautiful handcrafted piece made with care by our artisans.'}</p>

        <!-- Stock -->
        <div style="margin-bottom:28px">
          ${p.stock_qty > 0
            ? `<span style="color:var(--sage);font-size:13px;font-weight:500">✓ In Stock (${p.stock_qty} available)</span>`
            : `<span style="color:var(--error);font-size:13px;font-weight:500">✕ Out of Stock</span>`
          }
        </div>

        ${p.stock_qty > 0 ? `
          <!-- Qty & Add to Cart -->
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:24px;flex-wrap:wrap">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input class="qty-val" type="number" id="qty" value="1" min="1" max="${p.stock_qty}">
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn-primary btn-lg" style="flex:1;min-width:200px" onclick="addToCartWithQty()">
              🛒 Add to Cart
            </button>
          </div>
          <a href="cart.html" class="btn btn-secondary btn-full" onclick="addToCartWithQty()">Buy Now — Go to Cart</a>
        ` : `
          <button class="btn btn-lg btn-full" style="background:var(--sand);color:var(--text-muted);cursor:not-allowed" disabled>Out of Stock</button>
        `}

        <!-- Trust badges -->
        <div style="display:flex;gap:20px;margin-top:32px;padding-top:32px;border-top:1px solid var(--border);flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)"><span>🎨</span> Handcrafted</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)"><span>📦</span> Carefully packed</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)"><span>🔔</span> Live tracking</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)"><span>📧</span> Email updates</div>
        </div>

        <!-- Tags -->
        ${p.tags?.length > 0 ? `
          <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">
            ${p.tags.map(t => `<span style="padding:4px 12px;background:var(--sand);border-radius:20px;font-size:12px;color:var(--text-secondary)">${t}</span>`).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `;

  // Load related
  loadRelated(p.category_id, p.id);
}

function setImage(index) {
  currentImageIndex = index;
  const mainImg = document.getElementById('main-img-el');
  if (mainImg && currentProduct.images?.[index]) {
    mainImg.src = currentProduct.images[index];
  }
  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });
}

function changeQty(delta) {
  const input = document.getElementById('qty');
  if (!input) return;
  const val = parseInt(input.value) + delta;
  input.value = Math.max(1, Math.min(currentProduct.stock_qty, val));
}

function addToCartWithQty() {
  const qty = parseInt(document.getElementById('qty')?.value) || 1;
  Cart.add(currentProduct, qty);
}

async function loadRelated(categoryId, excludeId) {
  const { data } = await supabase
    .from('products')
    .select('*, categories(name)')
    .eq('category_id', categoryId)
    .eq('is_active', true)
    .neq('id', excludeId)
    .limit(4);

  const container = document.getElementById('related-products');
  if (!data || data.length === 0) {
    container.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted)">No related pieces found</div>`;
    return;
  }

  container.innerHTML = data.map(p => `
    <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
      <div class="product-card-img">
        ${p.images?.[0] ? `<img src="${p.images[0]}" alt="${p.title}">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--brown-light)">🎨</div>`}
        ${p.discount_percent > 0 ? `<span class="product-card-badge badge-sale">${p.discount_percent}% Off</span>` : ''}
      </div>
      <div class="product-card-body">
        <div class="product-card-category">${p.categories?.name || ''}</div>
        <div class="product-card-title">${p.title}</div>
        <div class="product-card-price">
          <span class="price-final">${formatPrice(p.final_price)}</span>
          ${p.discount_percent > 0 ? `<span class="price-original">${formatPrice(p.price)}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

loadProduct();
</script>
</body>
</html>
